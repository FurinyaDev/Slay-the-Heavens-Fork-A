name: GIL candidate
run-name: GIL candidate / ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character develop commit SHA with successful Quality and Licenses push runs'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: gil-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1429751262' && github.ref == 'refs/heads/develop'
    runs-on: windows-2025
    timeout-minutes: 45
    environment: gil-candidate
    env:
      MILIASTRA_ALLOW_LIVE_WRITE: '0'
      MILIASTRA_SAVE_ROOTS: '[]'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Start download measurement
        run: |
          $received = (Get-NetAdapterStatistics | Measure-Object -Property ReceivedBytes -Sum).Sum
          "GIL_START_RX=$([long]$received)" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/gil-candidate.yml
            /scripts/gil-candidate.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Verify source, CI and distribution approval
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GIL_CANDIDATE_APPROVAL: ${{ vars.GIL_CANDIDATE_APPROVAL }}
        run: node control/scripts/gil-candidate.mjs preflight
      - name: Download and verify approved base GIL
        if: steps.candidate.outputs.build == 'true'
        env:
          GIL_BASE_URL: ${{ secrets.GIL_BASE_URL }}
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
        run: node control/scripts/gil-candidate.mjs base
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          sparse-checkout:
            scripts
            src/lua
            data
            config
            tools
            art/characters/traveler-geo/portraits
            art/lowpoly-select
            art/performance
            experiments/lumine-native-fit/fit-hybrid-final
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          repository: 8itlab/genshin-miliastra-mcp
          ref: ${{ steps.candidate.outputs.tool_commit }}
          path: miliastra-mcp
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /src/
            /docs/PLATFORM_RULES.zh-CN.md
            /*.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            miliastra-mcp/npm-shrinkwrap.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.candidate.outputs.build == 'true'
        with:
          python-version: '3.12.10'
      - name: Install pinned build dependencies
        if: steps.candidate.outputs.build == 'true'
        run: |
          node control/scripts/gil-candidate.mjs toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000 --replace-registry-host=always --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp run build:core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix source ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Restore source assets and verify clean checkout
        if: steps.candidate.outputs.build == 'true'
        env:
          CI_LFS_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node control/scripts/gil-candidate.mjs assets
      - name: Build, read back and verify the complete game
        if: steps.candidate.outputs.build == 'true'
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORK_KEY: ${{ steps.candidate.outputs.work_key }}
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
          REQUEST_ID: ${{ steps.candidate.outputs.request_id }}
          MILIASTRA_PYTHON: python
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:MILIASTRA_MCP_ROOT = (Resolve-Path ../miliastra-mcp).Path
          $timer = [Diagnostics.Stopwatch]::StartNew()
          npm run build:native -- "$env:RUNNER_TEMP/gil-base.gil" build/hosted-gil "--work-key=$env:WORK_KEY" *> "$env:RUNNER_TEMP/gil-native.log"
          if ($LASTEXITCODE -ne 0) {
            node ../control/scripts/gil-candidate.mjs diagnose
            exit 1
          }
          $env:GIL_BUILD_SECONDS = $timer.Elapsed.TotalSeconds.ToString('F1', [Globalization.CultureInfo]::InvariantCulture)
          $received = (Get-NetAdapterStatistics | Measure-Object -Property ReceivedBytes -Sum).Sum
          $env:GIL_RECEIVED_BYTES = [long]$received - [long]$env:GIL_START_RX
          node ../control/scripts/gil-candidate.mjs deliver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          name: gil-candidate-${{ steps.candidate.outputs.request_id }}
          path: source/build/gil-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
