name: GIL candidate Windows probe
on:
  push:
    branches: [ci/gil-candidate-windows-probe]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository_id == '1460097312' && github.ref == 'refs/heads/ci/gil-candidate-windows-probe'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      MILIASTRA_ALLOW_LIVE_WRITE: '0'
      MILIASTRA_SAVE_ROOTS: '[]'
      GIT_LFS_SKIP_SMUDGE: '1'
      SOURCE_SHA: '73c21489efaab409d4c0c46bee517d410d3427fc'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/gil-candidate.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FurinyaWorks/Slay-the-Heavens
          ref: '73c21489efaab409d4c0c46bee517d410d3427fc'
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts
            src/lua
            data
            config
            tools
            art/characters/traveler-geo/portraits
            art/lowpoly-select
            art/performance
            experiments/lumine-native-fit/fit-hybrid-final
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 8itlab/genshin-miliastra-mcp
          ref: 70470757d6fcb319c5afec13b178c87f2d8d54b3
          path: miliastra-mcp
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Reject a request with missing approved base
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $result = node control/scripts/gil-candidate.mjs base 2>&1
          if ($LASTEXITCODE -ne 1 -or "$result" -notmatch 'Missing protected GIL_BASE_URL') { throw 'Expected base rejection' }
          Write-Output 'Missing approved base rejected before download.'
          $global:LASTEXITCODE = 0
      - name: Compile MCP and run its offline GIL write and readback tests
        run: |
          node control/scripts/gil-candidate.mjs toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000 --replace-registry-host=always --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp run build:core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node control/scripts/gil-candidate.mjs toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test miliastra-mcp/tests/scene-signal.mjs miliastra-mcp/tests/scene-client-ui.mjs miliastra-mcp/tests/scene-interface.mjs
      - name: Verify sparse source and production media
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: |
          npm --prefix source ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node control/scripts/gil-candidate.mjs assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location source
          npm run build:ui -- build/gil-ui-check --official-assets --refined-release-monsters --native-page-lifecycle
