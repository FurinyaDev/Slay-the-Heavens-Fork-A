name: GIL candidate
run-name: GIL candidate / ${{ inputs.source_ref || github.ref_name }} / ${{ github.sha }}
on:
  push:
    branches: ['release/**']
    tags: ['v[0-9]*', 'engine-v[0-9]*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'develop, verified develop SHA, release/vX.Y.Z, or formal SemVer tag'
        default: develop
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.repository_id == '1429751262' && !github.event.deleted && (github.event_name == 'push' || github.ref == 'refs/heads/develop')
    runs-on: windows-2025
    timeout-minutes: 45
    environment: gil-candidate
    env:
      MILIASTRA_ALLOW_LIVE_WRITE: '0'
      MILIASTRA_SAVE_ROOTS: '[]'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Start download measurement
        run: |
          $received = (Get-NetAdapterStatistics | Measure-Object -Property ReceivedBytes -Sum).Sum
          "GIL_START_RX=$([long]$received)" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/gil-candidate.yml
            /scripts/gil-candidate.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Verify source, CI and distribution approval
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GIL_CANDIDATE_APPROVAL: ${{ vars.GIL_CANDIDATE_APPROVAL }}
        run: node control/scripts/gil-candidate.mjs preflight
      - name: Download and verify approved base GIL
        env:
          GIL_BASE_URL: ${{ secrets.GIL_BASE_URL }}
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
        run: node control/scripts/gil-candidate.mjs base
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: source
          persist-credentials: false
          sparse-checkout:
            scripts
            src/lua
            data
            docs/evidence
            config
            tools
            art/characters/traveler-geo/portraits
            art/lowpoly-select
            art/performance
            experiments/lumine-native-fit/fit-hybrid-final
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 8itlab/genshin-miliastra-mcp
          ref: ${{ steps.candidate.outputs.tool_commit }}
          path: miliastra-mcp
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /src/
            /docs/PLATFORM_RULES.zh-CN.md
            /*.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            miliastra-mcp/npm-shrinkwrap.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install pinned build dependencies
        run: |
          node control/scripts/gil-candidate.mjs toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000 --replace-registry-host=always --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp run build:core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix source ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Restore source assets and verify clean checkout
        env:
          CI_LFS_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          EXPECTED_VERSION: ${{ steps.candidate.outputs.expected_version }}
        run: node control/scripts/gil-candidate.mjs assets
      - name: Build, read back and verify the complete game
        id: delivery
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          WORK_KEY: ${{ steps.candidate.outputs.work_key }}
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
          REQUEST_ID: ${{ steps.candidate.outputs.request_id }}
          SOURCE_REF: ${{ steps.candidate.outputs.source_ref }}
          EXPECTED_VERSION: ${{ steps.candidate.outputs.expected_version }}
          RELEASE_CANDIDATE: ${{ steps.candidate.outputs.release_candidate }}
          QUALITY_RUN: ${{ steps.candidate.outputs.quality_run }}
          LICENSES_RUN: ${{ steps.candidate.outputs.licenses_run }}
          GIL_PORTABLE_RECEIPT: '1'
          MILIASTRA_PYTHON: python
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:MILIASTRA_MCP_ROOT = (Resolve-Path ../miliastra-mcp).Path
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $arguments = @("$env:RUNNER_TEMP/gil-base.gil", 'build/hosted-gil', "--work-key=$env:WORK_KEY")
          if ($env:RELEASE_CANDIDATE -ceq 'true') { $arguments += '--release-candidate' }
          npm run build:native -- @arguments *> "$env:RUNNER_TEMP/gil-native.log"
          if ($LASTEXITCODE -ne 0) {
            node ../control/scripts/gil-candidate.mjs diagnose
            exit 1
          }
          $env:GIL_BUILD_SECONDS = $timer.Elapsed.TotalSeconds.ToString('F1', [Globalization.CultureInfo]::InvariantCulture)
          $received = (Get-NetAdapterStatistics | Measure-Object -Property ReceivedBytes -Sum).Sum
          $env:GIL_RECEIVED_BYTES = [long]$received - [long]$env:GIL_START_RX
          node ../control/scripts/gil-candidate.mjs deliver
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.delivery.outputs.artifact_name }}
          path: source/build/gil-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Verify the published archive download
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.delivery.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node control/scripts/gil-candidate.mjs verify-upload
